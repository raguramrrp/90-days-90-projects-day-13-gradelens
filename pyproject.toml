[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gradelens"
version = "1.0.0"
description = "GradeLens: Academic Performance Analytics & Weakness Detection Platform"
authors = [
    { name = "Ragu Ram P", email = "student@example.edu" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "sqlalchemy>=2.0.0",
    "openpyxl>=3.1.2",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.9",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
